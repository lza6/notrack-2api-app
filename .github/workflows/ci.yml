name: CI

# 本项目此前没有 CI（审计矩阵第 13 项缺口）。这里做最小但真实的三件事：
# 语法检查 → 单元测试 → 覆盖率地板（no-regression），外加挑战沙箱的 Node 测试。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile gateway/*.py wb_proxy.py

      # 一次跑完既出测试结果又出覆盖率（早先这里把 pytest 跑了两遍）。
      - name: Unit tests + coverage (no-regression floor)
        run: |
          python -m coverage run --source=gateway -m pytest tests/ -q
          python -m coverage report --sort=cover
          # 地板 = 当前实测值（2026-10-28：显示 16%，精确 15.75%）。coverage 按
          # 四舍五入整数比较，故 16 等价于精确 ≥15.5%，余量 0.25pp。
          # 注意：CI 绿只代表"没退步"，不代表达到 policy 的 80% 目标。
          python -m coverage report --fail-under=16

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Challenge sandbox fingerprint surface
        run: node tests/test_fingerprint_surface.mjs
